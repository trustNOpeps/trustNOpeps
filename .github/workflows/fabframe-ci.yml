name: FABFRAME quality checks
on:
  push:
    branches: [main]
    paths: ['apps/fabframe/**', '.github/workflows/fabframe-ci.yml']
  pull_request:
    paths: ['apps/fabframe/**', '.github/workflows/fabframe-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/fabframe/app.js && node --check apps/fabframe/studio.js && node --test apps/fabframe/tests/check.cjs
