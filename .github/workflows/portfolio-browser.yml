name: Portfolio browser smoke
on:
  push:
    branches: [main]
    paths: ['scripts/portfolio_browser_qa.py', '.github/workflows/portfolio-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published/trustNOpeps
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - run: |
          python -m http.server 8000 --directory published > /tmp/portfolio-http.log 2>&1 &
          for i in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8000/trustNOpeps/ >/dev/null && break; sleep 1; done
          python scripts/portfolio_browser_qa.py http://127.0.0.1:8000/trustNOpeps/
