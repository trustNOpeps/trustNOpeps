name: Portfolio regression checks
on:
  push:
    branches: [main]
    paths: ['projects/**', 'scripts/check_portfolio.py', '.github/workflows/portfolio-qa.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - run: python3 scripts/check_portfolio.py published projects/registry.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check published/immersive-world.js
          node --check published/apps/fabframe/app.js
          node --check published/apps/fabframe/studio.js
          node --check published/apps/machinescope/app.js
          node --check published/apps/machinescope/core.js
      - working-directory: apps/elsewhere
        run: npm run check
