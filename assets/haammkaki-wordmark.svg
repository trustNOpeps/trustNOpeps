<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">haammkaki animated portfolio wordmark</title>
<desc id="desc">Minimalist typographic banner with a blinking lime cursor.</desc>
<defs><clipPath id="reveal"><rect x="80" y="0" width="1040" height="320"><animate attributeName="width" values="0;1040;1040" keyTimes="0;.23;1" dur="6s" repeatCount="indefinite"/></rect></clipPath></defs>
<style>
 .brand {font:700 158px 'Inter','Arial',sans-serif;letter-spacing:-8px;text-anchor:middle;fill:#eeeae2}
 .cursor {animation:blink 1.2s steps(1,end) infinite}
 .accent {animation:pulse 5s ease-in-out infinite}
 @keyframes blink {0%,45%,100%{opacity:1}46%,85%{opacity:0}}
 @keyframes pulse {0%,100%{opacity:.7}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.cursor,.accent{animation:none}}
</style>
<rect width="1200" height="320" rx="12" fill="#0b1116"/>
<path d="M52 49H1148M52 272H1148" stroke="#2c3933" stroke-width="2"/>
<g clip-path="url(#reveal)"><text class="brand" x="597" y="207">haammkaki</text></g>
<circle class="accent" cx="1075" cy="196" r="9" fill="#c4f06b"/>
<rect class="cursor" x="1104" y="171" width="7" height="34" fill="#b3a0e7"/>
</svg>