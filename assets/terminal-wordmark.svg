<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
<title id="title">trustNOpeps animated pixel wordmark</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e9f0e7"/>
    <stop offset=".47" stop-color="#e9f0e7"/>
    <stop offset=".51" stop-color="#79e6bb"/>
    <stop offset=".7" stop-color="#84d2e6"/>
    <stop offset="1" stop-color="#e9f0e7"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-70%" width="140%" height="240%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>
<style>
  .word { font-family: "Courier New", Consolas, monospace; font-size: 117px; font-weight: 900; letter-spacing: -7px; text-anchor: middle; }
  .main { fill: url(#ink); animation: rise 5s steps(2,end) infinite; }
  .shadow { fill: #3a7a85; opacity: .52; }
  .aura { fill: #55e5b4; opacity: .20; animation: breathe 4.8s ease-in-out infinite; }
  @keyframes rise { 0%, 88%, 100% { transform: translateY(0); } 90% { transform: translateY(-3px); } 92% { transform: translateY(2px); } 94% { transform: translateY(0); } }
  @keyframes breathe { 0%,100% { opacity:.13; } 50% { opacity:.34; } }
  @media (prefers-reduced-motion: reduce) { .main, .aura { animation:none; } }
</style>
<rect width="1200" height="320" rx="18" fill="#090d13"/>
<text class="word aura" x="600" y="199" filter="url(#soft)">trustNOpeps</text>
<text class="word shadow" x="605" y="205">trustNOpeps</text>
<text class="word main" x="600" y="198">trustNOpeps</text>
</svg>