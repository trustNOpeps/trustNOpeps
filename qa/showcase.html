<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio responsive QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:12px}iframe{display:block;margin:auto;border:0;background:#0b1116}output{display:block;padding:12px}</style></head><body><header>Portfolio layout check · <a href="../">Open portfolio</a></header><iframe title="Portfolio responsive viewport" width="390" height="900"></iframe><output>Checking layout…</output><script>
const q=new URLSearchParams(location.search),f=document.querySelector('iframe');const width=['320','390','768','1140'].includes(q.get('width'))?q.get('width'):'390';f.width=width;const project=q.get('project')||'project-bourn';f.src='../#'+encodeURIComponent(project);f.onload=()=>{const d=f.contentDocument;d.documentElement.style.scrollBehavior="auto";d.getElementById(project)?.scrollIntoView();requestAnimationFrame(()=>{const broken=[...d.images].filter(i=>i.currentSrc&&i.complete&&i.naturalWidth===0);document.querySelector('output').textContent=JSON.stringify({viewport:+width,documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>+width,brokenImages:broken.length,showcaseRows:d.querySelectorAll('.showcase-row').length});})};
</script></body></html>
